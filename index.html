
<!DOCTYPE html>
<html>
<head>
<style>
  .container { display: flex; flex-direction: row; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; gap: 20px; align-items: flex-start; }
  .map-column { display: flex; flex-direction: column; gap: 15px; }
  .map-box { position: relative; border: 3px double #8B7355; background: #f2ebd9; padding: 5px; box-shadow: 3px 3px 10px rgba(0,0,0,0.3); }

  /* Legend styling */
  .legend-box {
    background-color: #fdfaf2;
    border: 2px solid #5c4033;
    border-radius: 5px;
    padding: 12px 18px;
    box-shadow: 2px 2px 8px rgba(0,0,0,0.2);
    color: #3d2a1d;
  }
  .legend-title { font-weight: bold; font-size: 14px; margin-bottom: 8px; color: #8b0000; border-bottom: 1px solid #5c4033; padding-bottom: 4px; }
  .legend-item { display: flex; align-items: center; gap: 10px; font-size: 13px; margin-bottom: 6px; }
  .legend-color { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #000; }

  .report-box { width: 450px; padding: 20px; border: 2px solid #5c4033; background-color: #fdfaf2; color: #3d2a1d; box-shadow: 2px 2px 8px rgba(0,0,0,0.2); border-radius: 5px; }
  .report-header { text-align: center; border-bottom: 2px solid #5c4033; margin-bottom: 15px; padding-bottom: 10px; }
  .title { font-size: 20px; font-weight: bold; color: #8b0000; letter-spacing: 1px; }
  .sub-title { font-size: 12px; font-style: italic; color: #5c4033; }
  label { font-weight: bold; font-size: 13px; display: block; margin-top: 10px; color: #5c4033; }
  input[type="text"], input[type="time"], textarea, select { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; border: 1px solid #a08060; background: #fffcf7; color: #3d2a1d; border-radius: 3px; }
  .time-row { display: flex; gap: 10px; }
  .time-col { flex: 1; }
  textarea { height: 80px; resize: none; }
  .btn { background-color: #8b0000; color: white; border: none; padding: 10px 15px; margin-top: 15px; cursor: pointer; font-weight: bold; border-radius: 3px; width: 100%; transition: 0.2s; }
  .btn:hover { background-color: #a30000; }
  .output-report { display: none; margin-top: 20px; padding: 15px; border: 1px dashed #8b0000; background-color: #fcf8ee; color: #2c1a0c; border-radius: 4px; font-family: monospace; white-space: pre-wrap; font-size: 12px; }
  .copy-btn { background-color: #4a5d4e; color: white; border: none; padding: 6px 12px; margin-top: 10px; cursor: pointer; font-size: 12px; border-radius: 3px; font-weight: bold; width: 100%; }
  .copy-btn:hover { background-color: #3b4d3e; }
</style>
</head>

    </div>

      <label>Patrol Location / Sector:</label>
      <input type="text" id="rep-loc" value="Windhelm Outer Bridge">

      <label>Patrol Officer Name & Rank:</label>
      <input type="text" id="rep-officer" value="Guard Officer">

      <div class="time-row">
        <div class="time-col">
          <label>Start Time:</label>
          <input type="time" id="rep-start-time" value="08:00">
        </div>
        <div class="time-col">
          <label>End Time:</label>
          <input type="time" id="rep-end-time" value="16:00">
        </div>
      </div>

        <option value="Suspicious Activity Reported">🟡 Suspicious Activity / Intel Gathered</option>
        <option value="Under Hostile Threat">🔴 Under Hostile Threat / Skirmish</option>
        <option value="Assistance Required">⚠️ Reinforcements Required immediately</option>
      </select>

      <label>Officer's Notes & Action Taken:</label>
      <textarea id="rep-notes" placeholder="Enter your live patrol observations, encounters or actions taken..."></textarea>

      <button type="button" class="btn" onclick="generatePatrolReport()">SUBMIT REPORT TO PALACE OF THE KINGS</button>
    </form>

    <div id="output-report-container" class="output-report"></div>
    <button id="copy-btn-id" class="copy-btn" style="display:none;" onclick="copyToClipboard()">📋 COPY REPORT TO CLIPBOARD</button>
  </div>

<script>
  const locs = [{"name": "WINDHELM (HQ)", "pos": [382, 187], "color": [255, 0, 0], "desc": "The capital of Eastmarch and stronghold of the Stormcloaks."}, {"name": "Kynesgrove", "pos": [368, 321], "color": [0, 255, 0], "desc": "A mining town south of Windhelm. Watch the Steamscorch Mine and local dragon burial mound."}, {"name": "Mixwater Mill", "pos": [235, 388], "color": [0, 255, 0], "desc": "A key lumber mill along the White River supplying timber for the war effort."}, {"name": "Anga's Mill", "pos": [184, 167], "color": [0, 255, 0], "desc": "Lumber mill to the west, vital supply line near the border of the Pale."}, {"name": "Darkwater Crossing", "pos": [309, 501], "color": [0, 255, 0], "desc": "A small mining settlement rich in corundum ore near the southern border."}, {"name": "Fort Amol", "pos": [161, 454], "color": [255, 0, 255], "desc": "A strategic fort currently occupied by hostile rogue mages. High danger."}, {"name": "Fort Morvunskar", "pos": [147, 301], "color": [255, 0, 255], "desc": "A ruined fort to the west overlooking the main road. Keep an eye out for conjurers."}, {"name": "Cronvangr Cave", "pos": [323, 361], "color": [255, 200, 0], "desc": "A cave system overrun with nests of massive Frostbite Spiders."}, {"name": "Stony Creek Cave", "pos": [529, 454], "color": [255, 200, 0], "desc": "A notorious bandit hideout along the eastern cliffs near Morrowind's border."}, {"name": "Uttering Hills Cave", "pos": [206, 280], "color": [255, 200, 0], "desc": "Bandit-infested cave system. Rumors suggest links to organized crime rings."}];

  document.getElementById('map').addEventListener('click', function(e) {
    const rect = e.target.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    const clickXPercent = x / rect.width;
    const clickYPercent = y / rect.height;

    let closest = null;
    let minDistance = 999999;

    locs.forEach(function(l) {
      const lx = l.pos[0] / 736;
      const ly = l.pos[1] / 669;
      const dist = Math.sqrt(Math.pow(lx - clickXPercent, 2) + Math.pow(ly - clickYPercent, 2));
      if (dist < minDistance) {
        minDistance = dist;
        closest = l;
      }
    });

    if (closest && minDistance < 0.12) {
      document.getElementById('rep-loc').value = closest.name;
      document.getElementById('rep-desc').value = closest.desc;
    } else {
      document.getElementById('rep-loc').value = "Wilderness Sector (" + Math.round(clickXPercent*100) + "%W, " + Math.round(clickYPercent*100) + "%H)";
      document.getElementById('rep-desc').value = "General Wilderness patrol sector in Eastmarch. Maintain extreme caution regarding wild beasts, giants, and bandits.";
    }
  });

  function generatePatrolReport() {
    const loc = document.getElementById('rep-loc').value;
    const officer = document.getElementById('rep-officer').value;
    const startTime = document.getElementById('rep-start-time').value;
    const endTime = document.getElementById('rep-end-time').value;
    const desc = document.getElementById('rep-desc').value;
    const status = document.getElementById('rep-status').value;
    const notes = document.getElementById('rep-notes').value || "No incident reported. Normal patrol routine maintained.";
    const dateStamp = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

    const formattedReport =
`=============================================
        ⚔️ WINDHELM PATROL REPORT ⚔️
=============================================
DATE OF PATROL: ${dateStamp}
PATROL SHIFT  : ${startTime} to ${endTime}
REPORTING GUARD: ${officer}
ASSIGNED SECTOR: ${loc}
=============================================
[SECTOR INTEL]
${desc}

[STATUS / THREAT LEVEL]
${status}

[OFFICER OBSERVATIONS & ACTION TAKEN]
${notes}
=============================================
                 FOR WINDHELM!
=============================================
`;

    const reportDiv = document.getElementById('output-report-container');
    reportDiv.innerText = formattedReport;
    reportDiv.style.display = 'block';
    document.getElementById('copy-btn-id').style.display = 'block';
  }

  function copyToClipboard() {
    const textToCopy = document.getElementById('output-report-container').innerText;
    navigator.clipboard.writeText(textToCopy).then(function() {
      alert("Report copied to clipboard! Ready to paste into your Discord or RP channel.");
    }, function(err) {
      alert("Could not copy text: ", err);
    });
  }
</script>
